name: Run complete enterprise demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start complete demo
        run: docker compose up --build -d

      - name: Wait for demo seed
        run: |
          set -e
          docker compose wait demo-seed
          echo "Demo seed completed successfully"
          docker compose logs --no-color demo-seed

      - name: Run smoke test
        run: python scripts/smoke-test.py

      - name: Print demo results
        run: python scripts/demo-results.py

      - name: Show service status
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color api demo-seed postgres neo4j minio frontend

      - name: Stop demo
        if: always()
        run: docker compose down -v
