name: Run complete enterprise demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start complete demo
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Docker pull/start attempt $attempt"
            if docker compose pull && docker compose up --build -d; then
              echo "Demo stack started successfully"
              exit 0
            fi
            echo "Attempt $attempt failed; cleaning up and retrying..."
            docker compose down -v || true
            sleep $((attempt * 10))
          done
          echo "Demo stack failed after 3 attempts"
          exit 1

      - name: Verify demo seed completed successfully
        run: |
          set -e
          seed_id="$(docker compose ps -a -q demo-seed)"
          if [ -z "$seed_id" ]; then
            echo "Demo seed container not found"
            exit 1
          fi
          status="$(docker inspect -f '{{.State.Status}}' "$seed_id")"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$seed_id")"
          echo "demo-seed status=$status exit_code=$exit_code"
          docker compose logs --no-color demo-seed
          if [ "$status" != "exited" ] || [ "$exit_code" != "0" ]; then
            echo "Demo seed did not complete successfully"
            exit 1
          fi
          echo "Demo seed completed successfully"

      - name: Run smoke test
        run: python scripts/smoke-test.py

      - name: Print demo results
        run: python scripts/demo-results.py

      - name: Show service status
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color api demo-seed postgres neo4j minio frontend

      - name: Stop demo
        if: always()
        run: docker compose down -v
