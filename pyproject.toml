[project]
name = "industrial-ai-foundry"
version = "0.5.2"
description = "Ontology-centric industrial AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "neo4j>=5.25",
  "redis>=5.1",
  "minio>=7.2",
  "pgvector>=0.3",
  "pyyaml>=6.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1"
]

[tool.ruff]
line-length = 100
